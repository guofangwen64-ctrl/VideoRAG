project:
  seed: 42
  artifact_dir: artifacts
data:
  # Set this once on the server. JSONL video paths are resolved below it.
  video_root: /media/pc3048/8e92fcae-9dcb-48b7-818b-82c5f8ed050e/aidata/GuoFangjin/MedHorizon_video/MedHorizon
chunking:
  # Consecutive fixed windows; the final shorter tail window is retained.
  duration_seconds: 30.0
  stride_seconds: 30.0
  frames_per_chunk: 8
  # Retry badly decoded videos through FFmpeg when this fraction of chunks is incomplete.
  ffmpeg_fallback_min_incomplete_ratio: 0.1
vision:
  # Experiment 1: general-domain primary baseline.
  provider: openai_clip
  model_name: ViT-B-32
  pretrained: openai
  device: cuda
  # Actual cross-chunk GPU batch. A6000 (48 GB) should start with 256.
  batch_size: 256
# vision:
#   provider: biomed_clip
#   device: cuda
#   batch_size: 32
# vision:
#   provider: siglip2
#   model_name: google/siglip2-base-patch16-naflex
#   device: cuda
#   batch_size: 16
retrieval:
  top_k: 5
  index_path: artifacts/index
llm:
  provider: extractive
  model: placeholder
  max_context_chunks: 5
evaluation:
  normalize_text: true
