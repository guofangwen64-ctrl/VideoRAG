# Research contract for the second-generation medical Graph-RAG pipeline.
# This configuration is NOT runnable by the current `medrag` CLI yet.
project:
  seed: 42
  artifact_dir: artifacts/graph_rag
pipeline:
  name: medical_graph_rag
  status: semantic_hypothesis_v3_pilot
  baseline_compatible: true
data:
  # Supply on the server through a local, untracked override or a future CLI flag.
  video_root: null
  annotation_schema: medical-graph-qa-v1
chunking:
  # Multi-scale values are hypotheses and must be selected on a development set.
  phase_window_seconds: 300
  phase_stride_seconds: 150
  event_window_seconds: 32
  event_stride_seconds: 16
graph:
  schema_version: medical-video-evidence-graph-v3-pilot
  scope: intra_video
  node_types: [segment, entity_mention, concept, action_event, temporal_event, phase_hypothesis, phase_boundary, instrument_track]
  edge_types: [temporal_before, contains, observed_in, instance_of, has_subject, acts_on, part_of, possible_continuation, derived_from, has_boundary, grounded_by, visible_during, co_occurs]
  builder:
    provider: deterministic_observation_normalizer
    require_grounded_intervals: true
    merge_threshold: 0.45
    max_merged_clips: 5
    max_representative_clips: 3
    finite_action_vocabulary: true
    separate_entity_attributes: true
    action_transition_merging: true
    event_structural_support: true
    event_representative_evidence: true
    use_medical_inferences: false
  semantic_layer:
    version: phase-boundary-instrument-track-v1
    fact_status: medical_hypothesis
    instrument_track_source: appearance_mentions
    instrument_tracking_scope: appearance_type_presence_not_physical_identity
    canonical_instrument_default: unknown
    physical_identity_confirmed: false
    candidate_ontology: diagnostic_only
    answers_used: false
    sequence_phase_inference:
      version: observation-sequence-phase-two-stage-v1
      input: complete_ordered_observation_descriptions
      stages: [open_activity_segmentation, strict_phase_mapping]
      uses_visual_frames: false
      output: phase_segments_and_event_projection
retrieval:
  strategy: deterministic_event_graph_v1
  initial_candidates: 20
  max_hops: 2
  top_k: 5
  max_verified_intervals: 5
  max_representatives_per_event: 2
  query_normalization: finite_action_entity_vocabulary
  event_structural_support_weight: 0.10
  query_aware_representative_reranking: true
  visual_fallback: true
  phase_instrument_reader:
    version: phase-instrument-track-reader-v2-query-fallback
    context_events: 1
    max_tracks: 6
    max_evidence_clips: 4
    frames_per_clip: 8
    instrument_identity_annotations_used: false
    qa_options_used_only_by_reader: true
    query_conditioned_phase_fallback:
      enabled: true
      source: open_activity_segments
      top_segments: 3
      max_clips_per_segment: 2
      frames_per_clip: 4
      min_confidence: low
      mutate_persistent_graph: false
llm:
  provider: not_configured
  model: not_configured
evaluation:
  evidence_iou_threshold: 0.3
  report_evidence_set_recall: true
  report_path_accuracy: true
  report_qa_accuracy: true
